  .rackdown-empty { font-size: var(--rackdown-label-size, 10px); }
  @media (prefers-color-scheme: dark) {
  .rackdown-rack { fill: var(--rackdown-rack-fill, #1e293b); stroke: var(--rackdown-rack-stroke, #94a3b8); }
