name: Catalogue integrity

on:
  push:
    paths:
      - "tools/devices/**"
      - "upstream/**"
      - "packages/rackdown-devices/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/catalogue-integrity.yml"
  pull_request:
    paths:
      - "tools/devices/**"
      - "upstream/**"
      - "packages/rackdown-devices/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/catalogue-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-full-catalogue:
    name: ${{ matrix.os }} / full catalogue
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check out pinned upstream revision
        run: node tools/devices/checkout-pinned-upstream.mjs upstream-checkout

      - name: Verify full catalogue against pinned upstream
        run: pnpm devices:verify-full -- upstream-checkout
